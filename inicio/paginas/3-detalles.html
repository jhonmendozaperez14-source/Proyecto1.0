<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Producto | Sueño Perfecto</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/detalles.css">
</head>
<body>

    <header class="navbar">
    <div class="logo">
        <span class="icon">🛏️</span>
        <strong>SueñoPerfecto</strong>
    </div>
    <nav class="enlaces-navegacion">
        <a href="1-inicio.html">Inicio</a>
        <a href="2-modelos.html">Modelos</a>
        <a href="mejoras_sueno_perfecto copy.html">Contacto</a>
    </nav>
    <div class="nav-button" style="display: flex; align-items: center; gap: 15px;">
        <a href="oferta.html" class="btn-ofertas">Ofertas 🔥</a>
        
        <div class="contenedor-carrito-nav">
            <a href="carrito.html" class="btn-carrito-nav" title="Ver Mi Carrito">
                🛒
                <span id="contador-carrito-nav" class="burbuja-contador">0</span>
            </a>
        </div>
    </div>
</header>

    <main class="contenedor-detalle">
        <div class="detalle-imagenes">
            <img id="item-imagen" src="" alt="Cargando producto...">
        </div>

        <div class="info-detalle">
            <h1 id="item-titulo">Cargando...</h1>
            <span id="item-precio" class="precio-grande">S/ 0.00</span>
            
            <p id="item-descripcion" class="descripcion-larga"></p>

            <ul id="item-caracteristicas" class="caracteristicas-tecnicas"></ul>

            <div class="acciones-detalle">
                <a href="#" id="btn-volver-dinamico" class="btn-regresar">← Volver</a>
                <a href="#" class="btn-ordenar">Comprar Ahora</a>
                
                <button id="btn-agregar-carro-detalle" class="btn-agregar-carro" style="width: auto; display: inline-block; margin-top: 0; margin-left: 10px; padding: 12px 20px;">
                    🛒 Agregar al carrito
                </button>
            </div>
        </div>
    </main>

    <script src="../js/detalles.js"></script>
</body>
</html>
